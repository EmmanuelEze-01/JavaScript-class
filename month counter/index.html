<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div id="counter"></div>
    </div>
    <script>
      function monthConter() {
        let now = new Date();

        let date = now.getDate();
        let daysLeft = 31 - date;

        counterValue = `There are ${daysLeft}days left in this month.`;
        document.getElementById("counter").textContent = counterValue;
      }

      setInterval(monthConter, 1000);
    </script>
  </body>
</html>
